server {
    server_name indexer.reality.gwei.name;

    access_log /var/log/nginx/indexer.reality.gwei.name_access.log;
    error_log /var/log/nginx/indexer.reality.gwei.name_error.log;

    # Block dotfiles and dotdirectories (.env, .git, .claude, etc.)
    location ~ (^|/)\. {
        return 403;
    }

    location /graphql {
        proxy_pass http://127.0.0.1:42070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ?chainIds= query param is ignored by the indexer but visible in access logs
        access_log /srv/rcdev/reality-eth-design/packages/indexer/logs/graphql-access.log;
    }

    location /health {
        proxy_pass http://127.0.0.1:42070;
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/indexer.reality.gwei.name/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/indexer.reality.gwei.name/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = indexer.reality.gwei.name) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name indexer.reality.gwei.name;
    return 404; # managed by Certbot
}

type Question @entity(immutable: false) {
  id: ID!
  questionId: Bytes!
  contract: Bytes!

  createdBlock: BigInt!
  createdTimestamp: BigInt!
  createdLogIndex: BigInt!
  updatedBlock: BigInt!
  updatedTimestamp: BigInt!

  template: Template

  data: String!

  qJsonStr: String
  qTitle: String
  qCategory: String
  qDescription: String
  qLang: String
  qType: String

  # True if the question's parameters break out of the template (parameter
  # injection) or the resulting JSON cannot be parsed. When true, the parsed
  # fields above (qTitle/qType/qCategory/qLang/outcomes) are NOT populated from
  # the untrusted data and must be treated as invalid by consumers.
  malformed: Boolean

  user: Bytes!
  arbitrator: Bytes!
  openingTimestamp: BigInt!
  timeout: BigInt!

  bounty: BigInt!

  currentAnswer: Bytes
  currentAnswerBond: BigInt!
  currentAnswerTimestamp: BigInt

  contentHash: Bytes
  historyHash: Bytes

  minBond: BigInt!
  lastBond: BigInt!
  cumulativeBonds: BigInt!

  arbitrationRequestedTimestamp: BigInt
  arbitrationRequestedBy: String
  isPendingArbitration: Boolean!
  arbitrationOccurred: Boolean!
  answerFinalizedTimestamp: BigInt

  currentScheduledFinalizationTimestamp: BigInt!
  reopens: Question
  reopenedBy: Question

  outcomes: [Outcome!] @derivedFrom(field: "question")
  answers: [Answer!] @derivedFrom(field: "question")
  responses: [Response!] @derivedFrom(field: "question")
}

type Outcome @entity(immutable: false) {
  id: ID!
  answer: String!
  question: Question!
}

type Response @entity(immutable: false) {
  id: ID!
  timestamp: BigInt!
  logIndex: BigInt!
  answer: Bytes
  isUnrevealed: Boolean!
  isCommitment: Boolean!
  commitmentId: Bytes
  bond: BigInt!
  user: Bytes!
  historyHash: Bytes!
  question: Question!
  createdBlock: BigInt!
  revealedBlock: BigInt
}

type Answer @entity(immutable: false) {
  id: ID!
  timestamp: BigInt!
  answer: Bytes
  lastBond: BigInt!
  bondAggregate: BigInt!
  question: Question!
  createdBlock: BigInt!
}

type Category @entity(immutable: false) {
  id: ID!
  numConditions: Int!
  numOpenConditions: Int!
  numClosedConditions: Int!
}

type Template @entity(immutable: false) {
  id: ID!
  templateId: BigInt!
  contract: Bytes!
  user: Bytes!
  questionText: String 
  createdBlock: BigInt!
}

type Claim @entity(immutable: false) {
  id: ID!
  question: Question!
  user: Bytes!
  amount: BigInt!
  createdBlock: BigInt!
}

type Fund @entity(immutable: false) {
  id: ID!
  question: Question!
  user: Bytes!
  amount: BigInt!
  createdBlock: BigInt!
}

type Withdrawal @entity(immutable: false) {
  id: ID!
  user: Bytes!
  amount: BigInt!
  createdBlock: BigInt!
}

type UserAction @entity(immutable: false) {
  id: ID!
  actionType: String!
  user: Bytes!
  question: Question
  response: Response
  claim: Claim
  withdrawal: Withdrawal
  fund: Fund
  template: Template
  createdBlock: BigInt!
  createdTimestamp: BigInt!
}

type FactoryDeployment @entity(immutable: false) {
  id: ID!
  token_address: Bytes!  
  token_symbol: String!
  token_decimals: BigInt!
  factory: Bytes!  
  realityETH: Bytes!  
  createdBlock: BigInt!
  createdTimestamp: BigInt!
}

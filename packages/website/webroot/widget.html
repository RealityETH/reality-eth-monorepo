<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reality.eth</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-card-2: #1c2330;
    --border: #30363d;
    --border-subtle: #21262d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --text-dim: #484f58;
    --accent: #58a6ff;
    --accent-subtle: rgba(88,166,255,0.1);
    --accent-border: rgba(88,166,255,0.3);
    --green: #3fb950;
    --green-subtle: rgba(63,185,80,0.12);
    --green-border: rgba(63,185,80,0.35);
    --amber: #d29922;
    --amber-subtle: rgba(210,153,34,0.12);
    --amber-border: rgba(210,153,34,0.35);
    --red: #f85149;
    --red-subtle: rgba(248,81,73,0.12);
    --red-border: rgba(248,81,73,0.35);
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Dev state switcher ───────────────────── */
  .dev-bar {
    background: #1a1060; border-bottom: 1px solid #3730a3;
    padding: 8px 20px; display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: #a5b4fc;
  }
  .dev-bar span { opacity: 0.6; }
  .dev-btn {
    padding: 3px 10px; border-radius: 4px; border: 1px solid #4338ca;
    background: transparent; color: #a5b4fc; font-size: 11px; cursor: pointer;
    transition: background 0.1s;
  }
  .dev-btn:hover, .dev-btn.active { background: #3730a3; color: #e0e7ff; }

  /* ── Header ──────────────────────────────── */
  header {
    background: rgba(13,17,23,0.95);
    border-bottom: 1px solid var(--border-subtle);
    padding: 0 20px;
  }
  .header-inner {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
    height: 52px;
  }
  .logo {
    font-size: 14px; font-weight: 600; color: var(--text);
    text-decoration: none; display: flex; align-items: center; gap: 7px;
  }
  .logo-mark {
    width: 26px; height: 26px; border-radius: 6px;
    background: linear-gradient(135deg, #58a6ff 0%, #bc8cff 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
  }
  .header-chain {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted);
  }
  .chain-dot-live {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 2px var(--green-subtle);
  }
  .btn-wallet {
    padding: 5px 14px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: transparent;
    color: var(--text-muted); font-size: 12px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-wallet:hover { border-color: var(--text-muted); color: var(--text); }
  .btn-wallet.connected {
    border-color: var(--green-border); color: var(--green);
    background: var(--green-subtle);
  }

  /* ── Page ────────────────────────────────── */
  .page {
    max-width: 760px; margin: 0 auto;
    padding: 28px 20px 60px;
  }
  @media (max-width: 640px) {
    .page { padding: 20px 16px 48px; }
    .q-text { font-size: 17px; margin-bottom: 18px; }
    .header-chain span { display: none; }
  }

  /* ── Question header ─────────────────────── */
  .q-badges { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 500;
  }
  .badge-app   { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); }
  .badge-chain { background: var(--border-subtle); color: var(--text-dim); }
  .badge-open  { background: var(--green-subtle); color: var(--green); }
  .badge-arb   { background: var(--amber-subtle); color: var(--amber); }
  .badge-final { background: var(--border-subtle); color: var(--text-dim); }
  .app-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  .q-text {
    font-size: 20px; font-weight: 600; line-height: 1.35;
    margin-bottom: 24px; color: var(--text);
  }

  /* ── Layout ──────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
    .col-side { order: -1; }
    .col-main { order: 1; }
  }

  /* ── Cards ───────────────────────────────── */
  .card {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: var(--radius); padding: 16px;
  }
  .card + .card { margin-top: 12px; }
  .card-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 12px;
  }

  /* ── Status card ─────────────────────────── */
  .status-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 14px;
  }
  .status-answer-wrap { display: flex; flex-direction: column; gap: 3px; }
  .status-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .answer-pill {
    padding: 5px 16px; border-radius: var(--radius-sm);
    font-size: 16px; font-weight: 700;
  }
  .ap-yes { background: var(--green-subtle); color: var(--green); border: 1px solid var(--green-border); }
  .ap-no  { background: var(--red-subtle);   color: var(--red);   border: 1px solid var(--red-border); }
  .ap-none{ background: var(--border-subtle); color: var(--text-dim); border: 1px solid var(--border); font-size: 13px; }
  .status-bond-wrap { text-align: right; }
  .status-bond-val { font-size: 16px; font-weight: 700; color: var(--text); }

  .timer-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .timer-label { font-size: 11px; color: var(--text-dim); }
  .timer-val { font-size: 12px; font-weight: 600; color: var(--amber); }
  .timer-val.finalized { color: var(--text-dim); }
  .timer-bar-bg { height: 3px; background: var(--border-subtle); border-radius: 2px; overflow: hidden; }
  .timer-bar    { height: 100%; border-radius: 2px; background: var(--amber); }

  .status-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-subtle);
  }
  .sg { display: flex; flex-direction: column; gap: 1px; }
  .sg-k { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .sg-v { font-size: 12px; color: var(--text-muted); }
  .sg-v a { color: var(--accent); text-decoration: none; }

  /* ── Interact card ───────────────────────── */

  /* — Not connected — */
  .not-connected {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 8px 0; text-align: center;
  }
  .lock-ring {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
  }
  .nc-text { font-size: 13px; color: var(--text-dim); line-height: 1.45; }
  .btn-connect {
    width: 100%; padding: 10px; border-radius: var(--radius-sm);
    background: var(--accent); border: none;
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-connect:hover { opacity: 0.88; }
  .next-bond-hint { font-size: 11px; color: var(--text-dim); }

  /* — Answer form — */
  .answer-form { display: flex; flex-direction: column; gap: 12px; }

  .answer-options { display: flex; gap: 8px; }
  .answer-opt {
    flex: 1; padding: 10px 8px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: transparent;
    color: var(--text-muted); font-size: 13px; font-weight: 600;
    cursor: pointer; text-align: center; transition: all 0.12s;
  }
  .answer-opt:hover { border-color: var(--text-muted); color: var(--text); background: var(--bg-card-2); }
  .answer-opt.sel-yes { border-color: var(--green); background: var(--green-subtle); color: var(--green); }
  .answer-opt.sel-no  { border-color: var(--red);   background: var(--red-subtle);   color: var(--red); }
  .answer-opt.sel-inv { border-color: var(--border); background: var(--border-subtle); color: var(--text-muted); }

  .bond-field { display: flex; flex-direction: column; gap: 5px; }
  .bond-label { font-size: 11px; color: var(--text-dim); display: flex; justify-content: space-between; }
  .bond-label span { color: var(--text-muted); }
  .bond-input-wrap { position: relative; }
  .bond-input {
    width: 100%; padding: 9px 46px 9px 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
    font-weight: 600; outline: none; transition: border-color 0.15s;
  }
  .bond-input:focus { border-color: var(--accent); }
  .bond-denom {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-size: 12px; color: var(--text-dim); pointer-events: none;
  }
  .bond-note { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
  .bond-note strong { color: var(--text-muted); }

  .btn-submit {
    width: 100%; padding: 11px; border-radius: var(--radius-sm);
    border: none; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-submit:hover { opacity: 0.88; }
  .btn-submit:disabled { opacity: 0.35; cursor: default; }
  .btn-submit-dispute { background: var(--red); color: #fff; }
  .btn-submit-confirm { background: var(--green); color: #fff; }
  .btn-submit-first   { background: var(--accent); color: #fff; }

  /* — Tx pending — */
  .tx-pending {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 8px 0; text-align: center;
  }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--border-subtle);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tx-label { font-size: 13px; color: var(--text-muted); }
  .tx-hash { font-size: 11px; color: var(--text-dim); font-family: monospace; }
  .tx-hash a { color: var(--accent); text-decoration: none; }

  /* — Tx confirmed — */
  .tx-confirmed {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 8px 0; text-align: center;
  }
  .check-ring {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--green-subtle); border: 2px solid var(--green-border);
    display: flex; align-items: center; justify-content: center; color: var(--green);
  }
  .confirmed-text { font-size: 13px; color: var(--text-muted); line-height: 1.45; }
  .confirmed-text strong { color: var(--text); }

  /* — Finalized / claim — */
  .claim-section { display: flex; flex-direction: column; gap: 10px; }
  .claim-amount-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: var(--green-subtle);
    border: 1px solid var(--green-border); border-radius: var(--radius-sm);
  }
  .claim-amount-label { font-size: 12px; color: var(--green); }
  .claim-amount-val { font-size: 16px; font-weight: 700; color: var(--green); }
  .btn-claim {
    width: 100%; padding: 11px; border-radius: var(--radius-sm);
    border: none; font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--green); color: #fff;
  }
  .no-claim { font-size: 12px; color: var(--text-dim); text-align: center; padding: 6px 0; }

  /* — Arbitration — */
  .arb-info { display: flex; flex-direction: column; gap: 8px; }
  .arb-info p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
  .btn-arb-link {
    display: block; width: 100%; padding: 9px; border-radius: var(--radius-sm);
    border: 1px solid var(--amber-border); background: var(--amber-subtle);
    color: var(--amber); font-size: 13px; font-weight: 500; text-align: center;
    text-decoration: none; cursor: pointer;
  }

  /* ── Bond history ────────────────────────── */
  .bond-list { display: flex; flex-direction: column; }
  .bond-entry {
    display: grid; grid-template-columns: 20px 1fr auto;
    gap: 0 10px; padding: 11px 0; position: relative;
  }
  .bond-entry + .bond-entry { border-top: 1px solid var(--border-subtle); }
  .bond-entry:not(:last-child) .b-line::after {
    content: ''; position: absolute; left: 9px; top: 34px;
    width: 1px; height: calc(100% - 22px); background: var(--border-subtle);
  }
  .b-line { grid-column: 1; padding-top: 2px; position: relative; }
  .b-dot {
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700;
  }
  .bd-yes { background: var(--green-subtle); color: var(--green); border: 1.5px solid var(--green-border); }
  .bd-no  { background: var(--red-subtle);   color: var(--red);   border: 1.5px solid var(--red-border); }
  .bd-inv { background: var(--border-subtle); color: var(--text-dim); border: 1.5px solid var(--border); }

  .b-main { grid-column: 2; display: flex; flex-direction: column; gap: 2px; }
  .b-answer { font-size: 12px; font-weight: 600; }
  .b-answer.yes { color: var(--green); }
  .b-answer.no  { color: var(--red); }
  .b-answer.inv { color: var(--text-muted); }
  .b-tag {
    display: inline-flex; padding: 1px 5px; border-radius: 8px;
    font-size: 10px; font-weight: 500; margin-left: 4px; vertical-align: middle;
  }
  .tag-cur { background: var(--green-subtle); color: var(--green); }
  .tag-fin { background: var(--border-subtle); color: var(--text-dim); }
  .tag-dis { background: var(--red-subtle); color: var(--red); }
  .b-sub { font-size: 11px; color: var(--text-dim); font-family: monospace; }

  .b-right { grid-column: 3; text-align: right; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .b-amount { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; }
  .b-bar-bg { width: 64px; height: 2px; background: var(--border-subtle); border-radius: 1px; overflow: hidden; }
  .b-bar    { height: 100%; border-radius: 1px; }
  .bbar-yes { background: var(--green); }
  .bbar-no  { background: var(--red); }
  .b-time { font-size: 10px; color: var(--text-dim); }

  /* ── Details ─────────────────────────────── */
  .meta-list { display: flex; flex-direction: column; gap: 8px; }
  .meta-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .meta-k { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
  .meta-v { font-size: 11px; color: var(--text-muted); text-align: right; word-break: break-all; }
  .meta-v a { color: var(--accent); text-decoration: none; font-family: monospace; }
  .meta-v.mono { font-family: monospace; font-size: 10px; }

  /* ── Loading skeleton ────────────────────── */
  .skel {
    background: linear-gradient(90deg, var(--border-subtle) 25%, var(--bg-card-2) 50%, var(--border-subtle) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skel-text { height: 14px; margin-bottom: 8px; }
  .skel-title { height: 24px; margin-bottom: 10px; }
  .skel-card { height: 160px; border-radius: var(--radius); }
</style>
</head>
<body>

<!-- Dev state switcher -->
<div class="dev-bar">
  <span>Prototype state:</span>
  <button class="dev-btn" onclick="setState('loading')">Loading</button>
  <button class="dev-btn active" onclick="setState('open-nc')">Open — not connected</button>
  <button class="dev-btn" onclick="setState('open-first')">Open — first answer</button>
  <button class="dev-btn" onclick="setState('open-dispute')">Open — dispute</button>
  <button class="dev-btn" onclick="setState('tx-pending')">Tx pending</button>
  <button class="dev-btn" onclick="setState('tx-confirmed')">Tx confirmed</button>
  <button class="dev-btn" onclick="setState('arbitration')">Arbitration</button>
  <button class="dev-btn" onclick="setState('finalized')">Finalized</button>
</div>

<header>
  <div class="header-inner">
    <a class="logo" href="browse-cards.html">
      <div class="logo-mark">R</div>
      reality.eth
    </a>
    <div class="header-chain">
      <div class="chain-dot-live"></div>
      Ethereum
    </div>
    <button class="btn-wallet" id="wallet-btn">Connect wallet</button>
  </div>
</header>

<div class="page" id="page-content">
  <!-- rendered by JS -->
</div>

<script>
const QUESTION = {
  text: 'Did the Maker Governance vote on MIP102c2-SP18 (Scope Defined Parameter Changes) pass?',
  app: 'Snapshot · MakerDAO',
  appColor: 'linear-gradient(135deg,#58a6ff,#bc8cff)',
  chain: 'Ethereum',
  type: 'bool',
  arbitrator: 'Kleros',
  minBond: '0.01',
  contract: '0x325a2e0f…ca165b47',
  questionId: '0xc9efcc…9cb10',
  opened: '3 Jun 2026, 09:14',
  closes: '6 Jun 2026, 09:14',
  template: '2 (Snapshot)',
};

const HISTORY = [
  { answer:'yes', label:'Yes', addr:'0x7f3a…d291', time:'2 hours ago', bond:'2.5',  barPct:100, tag:'cur' },
  { answer:'no',  label:'No',  addr:'0x4d8c…a07f', time:'9 hours ago', bond:'1.25', barPct:50,  tag:'dis' },
  { answer:'yes', label:'Yes', addr:'0x9a1e…55bc', time:'1 day ago',   bond:'0.625',barPct:25,  tag:'' },
  { answer:'no',  label:'No',  addr:'0x2b5f…e340', time:'1 day ago',   bond:'0.313',barPct:12.5,tag:'' },
  { answer:'yes', label:'Yes', addr:'0x6c9d…b182', time:'2 days ago',  bond:'0.156',barPct:6.25,tag:'' },
];

function badges(state) {
  const stateTag = {
    'open-nc':      '<span class="badge badge-open">● Open</span>',
    'open-first':   '<span class="badge badge-open">● Open</span>',
    'open-dispute': '<span class="badge badge-open">● Open</span>',
    'tx-pending':   '<span class="badge badge-open">● Open</span>',
    'tx-confirmed': '<span class="badge badge-open">● Open</span>',
    'arbitration':  '<span class="badge badge-arb">⚖ Arbitration</span>',
    'finalized':    '<span class="badge badge-final">Finalized</span>',
  }[state] || '';
  return `
    <div class="q-badges">
      <span class="badge badge-app">
        <span class="app-dot" style="background:${QUESTION.appColor}"></span>
        ${QUESTION.app}
      </span>
      <span class="badge badge-chain">${QUESTION.chain}</span>
      ${stateTag}
    </div>`;
}

function bondHistory(finalTag) {
  return HISTORY.map((h, i) => `
    <div class="bond-entry">
      <div class="b-line"><div class="b-dot bd-${h.answer}">${h.label[0]}</div></div>
      <div class="b-main">
        <div class="b-answer ${h.answer}">
          ${h.label}
          ${i===0 && h.tag ? `<span class="b-tag ${finalTag||'tag-cur'}">${finalTag?'final':'current'}</span>` : ''}
          ${i>0 && h.tag==='dis' ? `<span class="b-tag tag-dis">disputed</span>` : ''}
        </div>
        <div class="b-sub">${h.addr} · ${h.time}</div>
      </div>
      <div class="b-right">
        <div class="b-amount">${h.bond} ETH</div>
        <div class="b-bar-bg"><div class="b-bar bbar-${h.answer}" style="width:${h.barPct}%"></div></div>
        <div class="b-time"></div>
      </div>
    </div>`).join('');
}

function details() {
  return `
    <div class="meta-list">
      <div class="meta-row"><span class="meta-k">Question ID</span><span class="meta-v mono"><a href="#">${QUESTION.questionId}</a></span></div>
      <div class="meta-row"><span class="meta-k">Contract</span><span class="meta-v"><a href="#">${QUESTION.contract}</a></span></div>
      <div class="meta-row"><span class="meta-k">Opened</span><span class="meta-v">${QUESTION.opened}</span></div>
      <div class="meta-row"><span class="meta-k">Closes</span><span class="meta-v">${QUESTION.closes}</span></div>
      <div class="meta-row"><span class="meta-k">Arbitrator</span><span class="meta-v"><a href="#">${QUESTION.arbitrator}</a></span></div>
      <div class="meta-row"><span class="meta-k">Min bond</span><span class="meta-v">${QUESTION.minBond} ETH</span></div>
      <div class="meta-row"><span class="meta-k">Template</span><span class="meta-v">${QUESTION.template}</span></div>
    </div>`;
}

function statusCard(opts) {
  const { answerHtml, bondVal, timerLabel, timerVal, timerPct, timerClass } = opts;
  return `
    <div class="card">
      <div class="card-title">Current status</div>
      <div class="status-top">
        <div class="status-answer-wrap">
          <div class="status-label">Best answer</div>
          ${answerHtml}
        </div>
        <div class="status-bond-wrap">
          <div class="status-label">Top bond</div>
          <div class="status-bond-val">${bondVal}</div>
        </div>
      </div>
      <div class="timer-row">

function selectAnswer(btn, type) {
  btn.closest('.answer-options').querySelectorAll('.answer-opt').forEach(b => {
    b.className = 'answer-opt';
  });
  btn.classList.add('sel-' + type);
  const submitBtn = document.getElementById('submit-btn');
  if (!submitBtn) return;
  submitBtn.className = 'btn-submit ' + ({
    yes: 'btn-submit-confirm', no: 'btn-submit-dispute', inv: 'btn-submit-dispute'
  }[type]);
  submitBtn.textContent = {
    yes: 'Confirm Yes', no: 'Dispute with No', inv: 'Submit Invalid'
  }[type];
}

function setState(s) {
  document.querySelectorAll('.dev-btn').forEach(b =>
    b.classList.toggle('active', b.textContent.trim().toLowerCase().replace(/\s+/g,'-') === s ||
    b.onclick?.toString().includes(`'${s}'`))
  );
  document.querySelectorAll('.dev-btn').forEach(b => {
    b.classList.remove('active');
    if (b.getAttribute('onclick') === `setState('${s}')`) b.classList.add('active');
  });
  const walletBtn = document.getElementById('wallet-btn');
  if (['open-nc','loading','open-first'].includes(s)) {
    walletBtn.textContent = 'Connect wallet';
    walletBtn.className = 'btn-wallet';
  } else {
    walletBtn.textContent = '0x7f3a…d291';
    walletBtn.className = 'btn-wallet connected';
  }
  document.getElementById('page-content').innerHTML = (STATES[s] || STATES['open-nc'])();
}

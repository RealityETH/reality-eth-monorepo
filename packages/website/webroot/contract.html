<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reality.eth — Contract</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --bg-card: #161b22; --bg-card-hover: #1c2330;
    --border: #30363d; --border-subtle: #21262d;
    --text: #e6edf3; --text-muted: #8b949e; --text-dim: #484f58;
    --accent: #58a6ff; --accent-subtle: rgba(88,166,255,0.1);
    --green: #3fb950; --green-subtle: rgba(63,185,80,0.12);
    --amber: #d29922; --amber-subtle: rgba(210,153,34,0.12);
    --red: #f85149; --red-subtle: rgba(248,81,73,0.12);
    --purple: #bc8cff; --purple-subtle: rgba(188,140,255,0.1);
    --radius: 8px; --radius-sm: 5px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }

  /* ── Header ── */
  header { position: sticky; top: 0; z-index: 100;
    background: rgba(13,17,23,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle); padding: 0 24px; }
  .header-inner { max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px; height: 56px; }
  .logo { font-size: 15px; font-weight: 600; color: var(--text);
    text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo-mark { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; }
  .header-spacer { flex: 1; }
  #wallet-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: transparent; color: var(--text-muted); font-size: 13px; cursor: pointer; }
  #wallet-btn.connected { border-color: rgba(63,185,80,0.5); color: var(--green);
    font-family: monospace; font-size: 12px; letter-spacing: -0.01em; }

  /* ── Page ── */
  .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }

  /* ── Breadcrumb ── */
  .breadcrumb { display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
  .breadcrumb a { color: var(--text-muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb svg { color: var(--text-dim); }

  /* ── Loading / error ── */
  .state-msg { padding: 60px 0; text-align: center; color: var(--text-muted); }

  /* ── Contract header ── */
  .contract-hero { margin-bottom: 28px; }
  .contract-badges { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge-chain { background: var(--accent-subtle); color: var(--accent); }
  .badge-version { background: var(--border-subtle); color: var(--text-muted); }
  .badge-erc20 { background: var(--purple-subtle); color: var(--purple); }
  .badge-native { background: var(--green-subtle); color: var(--green); }
  .contract-address-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .contract-address { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 18px;
    font-weight: 600; color: var(--text); word-break: break-all; }
  .ext-link { display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--text-dim); text-decoration: none;
    padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px;
    transition: color 0.15s, border-color 0.15s; white-space: nowrap; }
  .ext-link:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Cards ── */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
  .card { background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: var(--radius); padding: 18px 20px; }
  .card-full { grid-column: 1 / -1; }
  .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 14px; }

  /* ── Meta list ── */
  .meta-list { display: flex; flex-direction: column; gap: 10px; }
  .meta-row { display: flex; gap: 12px; align-items: baseline; }
  .meta-key { font-size: 12px; color: var(--text-dim); min-width: 110px; flex-shrink: 0; }
  .meta-val { font-size: 13px; color: var(--text-muted); }
  .meta-val a { color: var(--accent); text-decoration: none; }
  .meta-val a:hover { text-decoration: underline; }
  .meta-val.mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; }

  /* ── Features ── */
  .feature-list { display: flex; flex-direction: column; gap: 8px; }
  .feature-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--text-muted); }
  .feature-icon { color: var(--green); flex-shrink: 0; margin-top: 1px; }

  /* ── Arbitrators ── */
  .arb-list { display: flex; flex-direction: column; gap: 8px; }
  .arb-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .arb-name { font-size: 13px; color: var(--text); font-weight: 500; }
  .arb-addr { font-family: monospace; font-size: 11px; color: var(--text-dim); }

  /* ── Audit ── */
  .audit-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .audit-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 10px; }
  .none-note { font-size: 13px; color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="browse.html">
      <img class="logo-mark" src="icon.png" alt="reality.eth" width="28" height="28">
      reality.eth
    </a>
    <div class="header-spacer"></div>
    <button id="wallet-btn" class="btn-outline">Connect wallet</button>
  </div>
</header>

<div class="page">
  <div class="breadcrumb">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    <a href="browse.html">Browse</a>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    <span>Contract</span>
  </div>

  <div id="loading" class="state-msg">Loading contract info…</div>
  <div id="error"   class="state-msg" style="display:none"></div>
  <div id="content" style="display:none">
    <div class="contract-hero">
      <div class="contract-badges" id="badges"></div>
      <div class="contract-address-row">
        <div class="contract-address" id="hero-address"></div>
        <a id="explorer-link" class="ext-link" href="#" target="_blank" rel="noopener noreferrer" style="display:none">
          View on explorer
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<script src="js/settings.js"></script>
<script src="js/wallet.js"></script>
<script>
(async function () {
'use strict';

// ── Version metadata (audit files + source commits) ───────────────────────────
const VERSION_META = {
  'RealityETH-2.0':       { audit: 'RealityETH-2.0.rst',       commit: 'https://github.com/realitio/realitio-contracts/commit/40ab84fc2a1342ba36d1a36aed8e7f81c84844ed' },
  'RealityETH-2.1':       { audit: null,                         commit: 'https://github.com/RealityETH/monorepo/commit/2ca642aab0188bee2891a64dea0a537ebc66406b' },
  'RealityETH-3.0':       { audit: 'RealityETH-3.0.txt',        commit: 'https://github.com/RealityETH/monorepo/commit/c6aa3d7d81912c330f11ebd6e349f2836e2b491e' },
  'RealityETH-3.2':       { audit: 'RealityETH-3.0.txt',        commit: null },
  'RealityETH_ERC20-2.0': { audit: 'RealityETH_ERC20-2.0.txt', commit: 'https://github.com/realitio/realitio-contracts/commit/7c2096b22f7aa9bfb496f0c167ecce07108d7218' },
  'RealityETH_ERC20-3.0': { audit: 'RealityETH_ERC20-3.0.txt', commit: 'https://github.com/RealityETH/monorepo/commit/e4584d7cf6ab2d9a5b129bd970b7d4517811ae6a' },
  'RealityETH_ERC20-3.2': { audit: 'RealityETH_ERC20-3.0.txt', commit: null },
};

// Features present from each major version onwards
const VERSION_FEATURES = [
  { fromMajor: 3, label: 'Minimum bond enforcement', note: 'Questions can require a minimum opening bond.' },
  { fromMajor: 3, label: 'Commit-reveal answers',    note: 'Answerers can hide their answer until after posting, preventing front-running.' },
  { fromMajor: 3.2, label: 'Template hash verification', note: 'Custom template text is hashed on-chain, allowing trustless verification.' },
];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function short(addr) { return addr.slice(0, 8) + '…' + addr.slice(-6); }

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const err = document.getElementById('error');
  err.textContent = msg;
  err.style.display = '';
}

// ── Parse URL ─────────────────────────────────────────────────────────────────
const m = location.hash.match(/\/network\/(\d+)\/contract\/(0x[0-9a-fA-F]+)/i);
if (!m) { showError('Invalid URL — expected #!/network/{chainId}/contract/{address}'); }
else run(parseInt(m[1]), m[2].toLowerCase());

async function run(chainId, address) {
  let contracts, tokens, chains;
  try {
    [contracts, tokens, chains] = await Promise.all([
      fetch('generated/contracts.json').then(r => r.json()),
      fetch('generated/tokens.json').then(r => r.json()),
      fetch('generated/chains.json').then(r => r.json()),
    ]);
  } catch (e) {
    showError('Failed to load contract data.'); return;
  }

  // Find the entry for this address on this chain
  const chainData = contracts[String(chainId)] || {};
  let tokenSym = null, versionKey = null, info = null;
  outer: for (const [tok, versions] of Object.entries(chainData)) {
    for (const [ver, v] of Object.entries(versions)) {
      if (v.address?.toLowerCase() === address) {
        tokenSym = tok; versionKey = ver; info = v; break outer;
      }
    }
  }
  if (!info) { showError(`Contract ${address} not found in registry for chain ${chainId}.`); return; }

  const chainInfo = chains[String(chainId)] || {};
  const chainName = chainInfo.chainName || `Chain ${chainId}`;
  const explorer  = (chainInfo.blockExplorerUrls || [])[0] || '';
  const tokenInfo = tokens[tokenSym] || {};
  const isERC20   = !!info.token_address;
  const verMeta   = VERSION_META[versionKey] || {};

  // Parse version number for feature gating
  const verNum = parseFloat((versionKey.match(/[-_](\d+\.\d+)/) || [])[1] || '0');
  const features = VERSION_FEATURES.filter(f => verNum >= f.fromMajor);
  if (isERC20) features.unshift({ label: 'ERC-20 token bonds', note: `Bond payments use ${tokenSym} tokens rather than the chain's native currency.` });

  // ── Render ─────────────────────────────────────────────────────────────────
  document.title = `reality.eth — ${versionKey} on ${chainName}`;

  const badges = document.getElementById('badges');
  badges.innerHTML = `
    <span class="badge badge-chain">${esc(chainName)}</span>
    <span class="badge badge-version">${esc(versionKey)}</span>
    <span class="badge ${isERC20 ? 'badge-erc20' : 'badge-native'}">${isERC20 ? 'ERC-20' : 'Native token'}</span>
  `;

  document.getElementById('hero-address').textContent = address;

  if (explorer) {
    const lnk = document.getElementById('explorer-link');
    lnk.href = `${explorer}/address/${address}`;
    lnk.style.display = '';
  }

  // Cards
  const cards = document.getElementById('cards');
  cards.innerHTML = '';

  // ── Card: Overview ─────────────────────────────────────────────────────────
  function metaRow(key, valHtml) {
    return `<div class="meta-row"><span class="meta-key">${esc(key)}</span><span class="meta-val">${valHtml}</span></div>`;
  }

  const deployedBlock = info.block ? info.block.toLocaleString() : '—';
  const explorerAddrLink = explorer
    ? `<a href="${esc(explorer)}/address/${esc(address)}" target="_blank" rel="noopener noreferrer">${esc(short(address))} ↗</a>`
    : `<span class="mono">${esc(short(address))}</span>`;

  const overviewCard = el('div', 'card');
  overviewCard.innerHTML = `
    <div class="card-title">Overview</div>
    <div class="meta-list">
      ${metaRow('Chain', `${esc(chainName)} <span style="color:var(--text-dim);font-size:12px">(${chainId})</span>`)}
      ${metaRow('Contract version', esc(versionKey))}
      ${metaRow('Address', explorerAddrLink)}
      ${metaRow('Deployed at block', deployedBlock)}
    </div>
  `;
  cards.appendChild(overviewCard);

  // ── Card: Bond Token ───────────────────────────────────────────────────────
  const tokenCard = el('div', 'card');
  let tokenValHtml;
  if (isERC20) {
    const expLink = explorer
      ? `<a href="${esc(explorer)}/address/${esc(info.token_address)}" target="_blank" rel="noopener noreferrer">${esc(short(info.token_address))} ↗</a>`
      : `<span class="mono">${esc(short(info.token_address))}</span>`;
    tokenValHtml = `${esc(tokenSym)} ERC-20 — ${expLink}`;
  } else {
    tokenValHtml = `${esc(tokenSym)} (native currency)`;
  }
  const smallNum = tokenInfo.small_number;
  const smallNumStr = smallNum != null
    ? `${(smallNum / 1e18).toLocaleString(undefined, {maximumSignificantDigits: 6})} ${tokenSym}`
    : null;

  tokenCard.innerHTML = `
    <div class="card-title">Bond Token</div>
    <div class="meta-list">
      ${metaRow('Token', tokenValHtml)}
      ${metaRow('Type', isERC20 ? 'ERC-20 (requires approval)' : 'Native currency')}
      ${smallNumStr ? metaRow('Typical minimum', esc(smallNumStr)) : ''}
    </div>
  `;
  cards.appendChild(tokenCard);

  // ── Card: Features ─────────────────────────────────────────────────────────
  const featCard = el('div', 'card');
  const checkSvg = `<svg class="feature-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
  const featRows = features.map(f =>
    `<div class="feature-row">${checkSvg}<div><strong>${esc(f.label)}</strong><br><span style="font-size:12px;color:var(--text-dim)">${esc(f.note)}</span></div></div>`
  ).join('');
  featCard.innerHTML = `
    <div class="card-title">Features</div>
    ${features.length ? `<div class="feature-list">${featRows}</div>` : '<div class="none-note">Basic reality.eth (v2 — no minimum bond)</div>'}
  `;
  cards.appendChild(featCard);

  // ── Card: Security ─────────────────────────────────────────────────────────
  const secCard = el('div', 'card');
  const auditFile = verMeta.audit || null;
  const auditLink = auditFile
    ? `<a href="/packages/contracts/audits/${esc(auditFile)}" target="_blank" rel="noopener noreferrer">${esc(auditFile)} ↗</a>`
    : null;
  const commitLink = verMeta.commit
    ? `<a href="${esc(verMeta.commit)}" target="_blank" rel="noopener noreferrer">${esc(verMeta.commit.split('/').pop().slice(0,10))}… ↗</a>`
    : null;

  secCard.innerHTML = `
    <div class="card-title">Security</div>
    <div class="meta-list">
      ${metaRow('Audit', auditLink || '<span class="none-note">No audit on record</span>')}
      ${commitLink ? metaRow('Source commit', commitLink) : ''}
    </div>
  `;
  cards.appendChild(secCard);

  // ── Card: Arbitrators ─────────────────────────────────────────────────────
  const arbEntries = Object.entries(info.arbitrators || {});
  const arbCard = el('div', 'card');
  arbCard.classList.add('card-full');
  if (arbEntries.length === 0) {
    arbCard.innerHTML = `<div class="card-title">Arbitrators</div><div class="none-note">No configured arbitrators for this deployment.</div>`;
  } else {
    const arbRows = arbEntries.map(([addr, name]) => {
      const expLink = explorer
        ? `<a class="ext-link" href="${esc(explorer)}/address/${esc(addr)}" target="_blank" rel="noopener noreferrer">↗</a>`
        : '';
      return `<div class="arb-row">
        <span class="arb-name">${esc(name)}</span>
        <span class="arb-addr">${esc(addr)}</span>
        ${expLink}
      </div>`;
    }).join('');
    arbCard.innerHTML = `<div class="card-title">Arbitrators</div><div class="arb-list">${arbRows}</div>`;
  }
  cards.appendChild(arbCard);

  // Show content
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = '';
}

})();
</script>
<script>
function onWalletChange(addr) {
  const btn = document.getElementById('wallet-btn');
  if (!btn) return;
  if (addr) {
    btn.textContent = RealityWallet.shortAddr(addr);
    btn.classList.add('connected');
    btn.onclick = () => RealityWallet.disconnectWallet(onWalletChange);
  } else {
    btn.textContent = 'Connect wallet';
    btn.classList.remove('connected');
    btn.onclick = () => RealityWallet.connectWallet(onWalletChange);
  }
}
document.getElementById('wallet-btn').onclick = () => RealityWallet.connectWallet(onWalletChange);
RealityWallet.initWallet(onWalletChange);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reality.eth — Notifications</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --bg-card: #161b22; --border: #30363d; --border-subtle: #21262d;
    --text: #e6edf3; --text-muted: #8b949e; --text-dim: #484f58;
    --accent: #58a6ff; --accent-subtle: rgba(88,166,255,0.1);
    --green: #3fb950; --green-subtle: rgba(63,185,80,0.12);
    --amber: #d29922; --amber-subtle: rgba(210,153,34,0.12);
    --red: #f85149; --red-subtle: rgba(248,81,73,0.12);
    --radius: 8px; --radius-sm: 5px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }

  header { position: sticky; top: 0; z-index: 100;
    background: rgba(13,17,23,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle); padding: 0 24px; }
  .header-inner { max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px; height: 56px; }
  .logo { font-size: 15px; font-weight: 600; color: var(--text);
    text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo-mark { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; }
  .header-spacer { flex: 1; }
  .bell-btn { display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 6px;
    color: var(--accent); text-decoration: none;
    position: relative; flex-shrink: 0; }
  .bell-badge { position: absolute; top: 2px; right: 2px;
    min-width: 16px; height: 16px; background: var(--red); color: #fff;
    font-size: 10px; font-weight: 700; border-radius: 8px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center; line-height: 1; pointer-events: none; }

  .page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }
  .page-header { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; }
  .page-title { font-size: 20px; font-weight: 700; }
  .btn-mark-all { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text-muted); font-size: 12px; padding: 5px 12px; cursor: pointer;
    transition: border-color 0.15s, color 0.15s; }
  .btn-mark-all:hover { border-color: var(--accent); color: var(--accent); }

  .notif-list { display: flex; flex-direction: column; gap: 1px; }
  .notif-item { display: flex; align-items: flex-start; gap: 12px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: var(--radius); padding: 14px 16px; transition: border-color 0.15s; }
  .notif-item:hover { border-color: var(--border); }
  .notif-item.unseen { border-left: 3px solid var(--accent); }
  .notif-icon { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .notif-icon.new_answer    { background: var(--accent-subtle); color: var(--accent); }
  .notif-icon.finalized     { background: var(--green-subtle);  color: var(--green); }
  .notif-icon.arb_requested { background: var(--amber-subtle);  color: var(--amber); }
  .notif-icon.arb_resolved  { background: var(--green-subtle);  color: var(--green); }
  .notif-icon.new_question  { background: var(--accent-subtle); color: var(--accent); }
  .notif-body { flex: 1; min-width: 0; }
  .notif-detail { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .notif-title { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .notif-title a { color: var(--accent); text-decoration: none; }
  .notif-title a:hover { text-decoration: underline; }
  .notif-meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; display: flex; gap: 10px; }
  .notif-cond-link { font-size: 11px; color: var(--text-muted); text-decoration: none; }
  .notif-cond-link:hover { color: var(--accent); text-decoration: underline; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
  .empty-state p { font-size: 15px; }
  .empty-state small { font-size: 12px; color: var(--text-dim); display: block; margin-top: 6px; }

  .watches-link { display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted); text-decoration: none;
    padding: 5px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    transition: border-color 0.15s, color 0.15s; }
  .watches-link:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="browse.html">
      <img class="logo-mark" src="icon.png" alt="reality.eth" width="28" height="28">
      reality.eth
    </a>
    <div class="header-spacer"></div>
    <a class="bell-btn" id="bell-btn" href="notifications.html" title="Notifications">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="bell-badge" id="bell-badge" style="display:none"></span>
    </a>
  </div>
</header>

<div class="page">
  <div class="page-header">
    <h1 class="page-title">Notifications</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <a class="watches-link" href="watches.html">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Manage watches
      </a>
      <button class="btn-mark-all" id="mark-all-btn">Mark all read</button>
    </div>
  </div>
  <div id="notif-list" class="notif-list">
    <div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <p>Loading…</p>
    </div>
  </div>
</div>

<script src="js/watches.js"></script>
<script>
(function () {

const TYPE_ICON = {
  new_answer:    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  finalized:     '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
  arb_requested: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  arb_resolved:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  new_question:  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>',
};

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtTime(ts) {
  if (!ts) return '';
  const d   = new Date(ts * 1000);
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 60000)  return 'just now';
  if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
  return `${Math.floor(diff / 86400000)}d ago`;
}

function questionUrl(questionId) {
  // questionId is the Ponder compound "contract-questionId"
  const parts = questionId.match(/^(0x[0-9a-f]+)-(0x[0-9a-f]+)$/i);
  if (!parts) return '#';
  return `question.html#!/network/unknown/question/${questionId}`;
}

async function render() {
  const list = document.getElementById('notif-list');
  const notifications = await RealityWatches.getNotifications(200);

  if (notifications.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <p>No notifications yet</p>
      <small>Star questions or <a href="watches.html" style="color:var(--accent)">configure watches</a> to get notified.</small>
    </div>`;
    return;
  }

  list.innerHTML = notifications.map(n => {
    const icon       = TYPE_ICON[n.type] || TYPE_ICON.new_answer;
    const url        = `question.html#!/network/unknown/question/${esc(n.questionId)}`;
    const condLink   = n.conditionId
      ? `<a class="notif-cond-link" href="watch-configure.html#id=${esc(n.conditionId)}">View watch →</a>`
      : '';
    return `<div class="notif-item${n.seen ? '' : ' unseen'}" data-id="${esc(n.id)}">
      <div class="notif-icon ${esc(n.type)}">${icon}</div>
      <div class="notif-body">
        <div class="notif-detail">${esc(n.detail || n.type.replace('_', ' '))}</div>
        <div class="notif-title"><a href="${url}">${esc(n.title)}</a></div>
        <div class="notif-meta">
          <span>${fmtTime(n.timestamp)}</span>
          ${condLink}
        </div>
      </div>
    </div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
  await render();
  RealityWatches.updateBellBadge();

  document.getElementById('mark-all-btn').addEventListener('click', async () => {
    await RealityWatches.markAllSeen();
    document.querySelectorAll('.notif-item.unseen').forEach(el => el.classList.remove('unseen'));
    RealityWatches.updateBellBadge();
  });
});

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reality.eth — Watches</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --bg-card: #161b22; --border: #30363d; --border-subtle: #21262d;
    --text: #e6edf3; --text-muted: #8b949e; --text-dim: #484f58;
    --accent: #58a6ff; --accent-subtle: rgba(88,166,255,0.1);
    --red: #f85149; --red-subtle: rgba(248,81,73,0.12);
    --radius: 8px; --radius-sm: 5px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }

  header { position: sticky; top: 0; z-index: 100;
    background: rgba(13,17,23,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle); padding: 0 24px; }
  .header-inner { max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px; height: 56px; }
  .logo { font-size: 15px; font-weight: 600; color: var(--text);
    text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .logo-mark { width: 28px; height: 28px; flex-shrink: 0; border-radius: 6px; }
  .header-spacer { flex: 1; }
  .bell-btn { display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 6px;
    color: var(--text-muted); text-decoration: none;
    position: relative; flex-shrink: 0; transition: color 0.15s, background 0.15s; }
  .bell-btn:hover { color: var(--text); background: var(--bg-card); }
  .bell-badge { position: absolute; top: 2px; right: 2px;
    min-width: 16px; height: 16px; background: var(--red); color: #fff;
    font-size: 10px; font-weight: 700; border-radius: 8px; padding: 0 4px;
    display: flex; align-items: center; justify-content: center; line-height: 1; pointer-events: none; }

  .page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 64px; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .page-title { font-size: 20px; font-weight: 700; }

  .btn-new { display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; background: var(--accent); border: none;
    border-radius: var(--radius-sm); color: #fff; font-size: 13px; font-weight: 600;
    text-decoration: none; cursor: pointer; transition: opacity 0.15s; }
  .btn-new:hover { opacity: 0.85; }

  .watches-list { display: flex; flex-direction: column; gap: 8px; }
  .watch-row { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: var(--radius); gap: 12px; transition: border-color 0.15s; }
  .watch-row:hover { border-color: var(--border); }
  .watch-row-info { flex: 1; min-width: 0; }
  .watch-row-label { font-size: 13px; color: var(--text); }
  .watch-row-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .watch-row-label a { color: var(--accent); text-decoration: none; }
  .watch-row-label a:hover { text-decoration: underline; }
  .watch-row-delete { padding: 3px 10px; background: none; border: 1px solid var(--red);
    border-radius: var(--radius-sm); color: var(--red); font-size: 12px; cursor: pointer;
    transition: background 0.15s; }
  .watch-row-delete:hover { background: var(--red-subtle); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state p { font-size: 15px; margin-bottom: 16px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="browse.html">
      <img class="logo-mark" src="icon.png" alt="reality.eth" width="28" height="28">
      reality.eth
    </a>
    <div class="header-spacer"></div>
    <a class="bell-btn" id="bell-btn" href="notifications.html" title="Notifications">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="bell-badge" id="bell-badge" style="display:none"></span>
    </a>
  </div>
</header>

<div class="page">
  <div class="page-header">
    <h1 class="page-title">Watches</h1>
    <a class="btn-new" href="watch-configure.html">+ New watch</a>
  </div>
  <div id="watches-list" class="watches-list"></div>
</div>

<script src="js/watches.js"></script>
<script src="js/settings.js"></script>
<script>
(function () {

const KNOWN_CHAINS = [
  { id: 1,        label: 'Mainnet'  },
  { id: 100,      label: 'Gnosis'   },
  { id: 137,      label: 'Polygon'  },
  { id: 10,       label: 'Optimism' },
  { id: 42161,    label: 'Arbitrum' },
  { id: 11155111, label: 'Sepolia'  },
];

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shortAddr(addr) {
  return String(addr).slice(0, 6) + '…' + String(addr).slice(-4);
}

function describeWatch(cw) {
  const c = cw.conditions;
  const parts = [];
  if (c.chainId != null) {
    const ids = Array.isArray(c.chainId) ? c.chainId : [c.chainId];
    parts.push(ids.map(id => KNOWN_CHAINS.find(ch => ch.id === id)?.label || `Chain ${id}`).join(', '));
  }
  if (c.templateId != null) parts.push(`Template #${c.templateId}`);
  if (c.contract   != null) parts.push(shortAddr(c.contract));
  if (c.category   != null) parts.push(`Category: ${c.category}`);
  if (c.creator    != null) parts.push(`Creator: ${shortAddr(c.creator)}`);
  if (c.keywords?.length)   parts.push(`Keywords: ${c.keywords.join(', ')}`);
  return parts.join(' · ') || 'All questions';
}

async function render() {
  const listEl = document.getElementById('watches-list');
  const all    = await RealityWatches.getConditionWatches();

  if (all.length === 0) {
    listEl.innerHTML = `<div class="empty-state">
      <p>No watches configured yet.</p>
      <a class="btn-new" href="watch-configure.html">+ New watch</a>
    </div>`;
    return;
  }

  listEl.innerHTML = all.map(cw => `
    <div class="watch-row">
      <div class="watch-row-info">
        <div class="watch-row-label"><a href="watch-configure.html#id=${esc(cw.id)}">${esc(describeWatch(cw))}</a></div>
      </div>
      <div class="watch-row-actions">
        <button class="watch-row-delete" data-id="${esc(cw.id)}">Delete</button>
      </div>
    </div>`).join('');

  listEl.querySelectorAll('.watch-row-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this watch?')) return;
      await RealityWatches.removeConditionWatch(Number(btn.dataset.id));
      render();
    });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  RealityWatches.updateBellBadge();
  render();
});

})();
</script>
</body>
</html>

[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.20"
# Historical RealityETH contracts are deployed from their committed creation
# bytecode (test the bytecode, not the source), so forge only compiles our
# harness/interface/mocks. The suite reads the blobs from ./bytecode.
fs_permissions = [{ access = "read", path = "./bytecode" }]
